name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Next.js Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: Prepare Standalone Build
        run: |
          mkdir -p deployment/next-app
          cp -a .next/standalone/. deployment/next-app/
          
          # Copy public but exclude large static files to drastically speed up FTP
          rsync -av --exclude='*.pdf' --exclude='*.zip' --exclude='uploads/' --exclude='pyqs/' public/ deployment/next-app/public/
          
          mkdir -p deployment/next-app/.next
          cp -r .next/static deployment/next-app/.next/static
          
          # Include environment variables for runtime
          cat << EOF > deployment/next-app/.env.local
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          EOF
          
          # Clean up unnecessary files to drastically reduce FTP overhead and prevent 503 quota errors
          rm -rf deployment/next-app/node_modules/rxjs
          rm -rf deployment/next-app/node_modules/typescript
          rm -rf deployment/next-app/node_modules/prettier
          
          # Clean up Turbopack NFT junk
          find deployment/next-app -maxdepth 1 -type f \( -name "*.zip" -o -name "*.pdf" -o -name "*.docx" -o -name "*.doc" -o -name "*.ppt" -o -name "*.pptx" -o -name "*.txt" -o -name "*.js" -o -name "*.mjs" \) ! -name "server.js" ! -name "check-case.js" -delete
          find deployment/next-app -maxdepth 1 -type d \( -name "*pyq*" -o -name "*pattern*" -o -name "*physics*" -o -name "*bee*" -o -name "sutraverse-deployment" -o -name "_deploy" \) -exec rm -rf {} +

          # =========================================================================
          # STATIC ASSET BYPASS OPTIMIZATION (Offload serving static assets to Apache)
          # =========================================================================
          mkdir -p deployment/public/_next
          
          # Copy public files and static chunks directly to the root public/ directory
          rsync -av --exclude='*.pdf' --exclude='*.zip' --exclude='uploads/' --exclude='pyqs/' public/ deployment/public/
          cp -r .next/static deployment/public/_next/static
          
          # Create root .htaccess file for gzip compression, caching headers, and Passenger rules
          cat << 'EOF' > deployment/.htaccess
          # Enable Compression
          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json
          </IfModule>

          # Enable Caching Headers
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresDefault "access plus 1 month"
            ExpiresByType text/css "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType image/jpeg "access plus 1 year"
            ExpiresByType image/gif "access plus 1 year"
            ExpiresByType image/x-icon "access plus 1 year"
            ExpiresByType image/svg+xml "access plus 1 year"
          </IfModule>
          EOF
          
          # Force Passenger reload by touching tmp/restart.txt in the deployment root
          mkdir -p deployment/tmp
          touch deployment/tmp/restart.txt

          
          # Create root server.js for cPanel Passenger
          cat << 'EOF' > deployment/server.js
          // cPanel Cloudlinux entry point
          // Forwards execution to the Next.js standalone application
          const path = require('path');
          process.chdir(path.join(__dirname, 'next-app'));
          require('./next-app/server.js');
          EOF

      - name: FTP Sync to Server
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "set net:timeout 30; set net:max-retries 5; set net:reconnect-interval-base 5; set ssl:verify-certificate no; set ftp:passive-mode true; open -u '${{ secrets.FTP_USERNAME }}','$LFTP_PASSWORD' ftp://${{ secrets.FTP_SERVER }}; mirror -R -v --parallel=2 --no-perms --exclude-glob .git/ --exclude-glob .github/ --exclude-glob node_modules/ ./deployment/ ./; quit"

