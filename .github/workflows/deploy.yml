name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Next.js Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: Prepare Standalone Build
        run: |
          mkdir -p deployment/next-app
          cp -a .next/standalone/. deployment/next-app/
          
          # Copy public but exclude large static files to drastically speed up FTP
          rsync -av --exclude='*.pdf' --exclude='*.zip' --exclude='uploads/' --exclude='pyqs/' public/ deployment/next-app/public/
          
          mkdir -p deployment/next-app/.next
          cp -r .next/static deployment/next-app/.next/static
          
          # Include environment variables for runtime
          if [ -f .env.local ]; then cp .env.local deployment/next-app/; fi
          
          # Clean up unnecessary files to reduce FTP overhead
          rm -rf deployment/next-app/node_modules/rxjs
          rm -rf deployment/next-app/node_modules/typescript
          rm -rf deployment/next-app/node_modules/prettier
          
          # Create root server.js for cPanel Passenger
          cat << 'EOF' > deployment/server.js
          const path = require('path');
          process.chdir(path.join(__dirname, 'next-app'));
          require('./next-app/server.js');
          EOF
          
          mkdir -p deployment/tmp
          touch deployment/tmp/restart.txt

      - name: FTP Sync to Server
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "set net:timeout 30; set net:max-retries 3; set net:reconnect-interval-base 5; set ssl:verify-certificate no; set ftp:passive-mode true; open -u '${{ secrets.FTP_USERNAME }}','$LFTP_PASSWORD' ftp://${{ secrets.FTP_SERVER }}; mirror -R -v --parallel=2 --no-perms --exclude-glob .git/ --exclude-glob .github/ ./deployment/ ./; quit"

