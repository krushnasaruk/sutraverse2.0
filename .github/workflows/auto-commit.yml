name: Daily Auto Commit

on:
  schedule:
    # 1:00 AM IST is 7:30 PM UTC (19:30 UTC)
    - cron: '30 19 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  commit-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config --global user.name "krushnasaruk55"
        git config --global user.email "krushnasaruk1234@gmail.com"

    - name: Generate Variable Commits
      run: |
        # Generate random number between 12 and 20
        NUM_COMMITS=$((12 + RANDOM % 9))
        echo "Creating $NUM_COMMITS commits..."
        
        # Ensure directory for logging exists
        mkdir -p data
        
        for i in $(seq 1 $NUM_COMMITS); do
          # Create/update log with timestamp and commit index
          echo "Auto commit $i of $NUM_COMMITS on $(date)" >> data/contribution_log.txt
          git add data/contribution_log.txt
          git commit -m "chore: update contribution log [commit $i of $NUM_COMMITS]"
        done

    - name: Push Changes
      run: |
        git push origin main
