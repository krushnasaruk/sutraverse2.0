name: sutras_teacher
description: Official Teacher Companion App for Sutras Platform.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  provider: ^6.1.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  geolocator: ^13.0.2
  fl_chart: ^0.70.0
  shimmer: ^3.0.0
  shared_preferences: ^2.5.2
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
